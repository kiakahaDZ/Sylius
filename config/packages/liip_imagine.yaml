# LiipImagineBundle Configuration — PrinterTheme
# Optimized for web (Sylius shop) + Flutter API responsive delivery

liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: "%kernel.project_dir%/public"
                cache_prefix: "media/cache"

    driver: "gd"

    filter_sets:
        cache: ~

        # ─────────────────────────────────────────────
        # Product Images (square 1:1)
        # ─────────────────────────────────────────────

        sylius_shop_product_original:
            quality: 95
            filters:
                thumbnail: { size: [1200, 1200], mode: outbound }
                strip: ~

        sylius_shop_product_large_thumbnail:
            quality: 85
            filters:
                thumbnail: { size: [600, 600], mode: outbound }
                strip: ~

        sylius_shop_product_card:
            quality: 80
            filters:
                thumbnail: { size: [400, 400], mode: outbound }
                strip: ~

        sylius_shop_product_small_thumbnail:
            quality: 80
            filters:
                thumbnail: { size: [200, 200], mode: outbound }
                strip: ~

        # ─────────────────────────────────────────────
        # Banner Images
        # ─────────────────────────────────────────────

        sylius_banner_hero:
            quality: 85
            filters:
                thumbnail: { size: [1920, 600], mode: outbound }
                strip: ~

        sylius_banner_mobile:
            quality: 80
            filters:
                thumbnail: { size: [750, 400], mode: outbound }
                strip: ~

        sylius_offer_banner:
            quality: 85
            filters:
                thumbnail: { size: [800, 300], mode: outbound }
                strip: ~

        # ─────────────────────────────────────────────
        # Taxon Images
        # ─────────────────────────────────────────────

        sylius_taxon_card:
            quality: 85
            filters:
                thumbnail: { size: [400, 300], mode: outbound }
                strip: ~

        sylius_taxon_header:
            quality: 85
            filters:
                thumbnail: { size: [1200, 400], mode: outbound }
                strip: ~

        sylius_taxon_thumbnail:
            quality: 80
            filters:
                thumbnail: { size: [100, 100], mode: outbound }
                strip: ~
 
