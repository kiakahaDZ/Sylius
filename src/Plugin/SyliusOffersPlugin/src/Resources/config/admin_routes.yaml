sylius_admin_offer_index:
    path: /offers
    methods: [GET]
    defaults:
        _controller: SyliusOffersPlugin\Controller\Admin\OfferController::indexAction
        _sylius:
            template: "@SyliusOffersPlugin/admin/offer/index.html.twig"
            grid: sylius_offers_offer
            paginate: 10

sylius_admin_offer_create:
    path: /offers/new
    methods: [GET, POST]
    defaults:
        _controller: SyliusOffersPlugin\Controller\Admin\OfferController::createAction
        _sylius:
            template: "@SyliusOffersPlugin/admin/offer/create.html.twig"
            redirect: sylius_admin_offer_index

sylius_admin_offer_update:
    path: /offers/{id}/edit
    methods: [GET, PUT, POST]
    defaults:
        _controller: SyliusOffersPlugin\Controller\Admin\OfferController::updateAction
        _sylius:
            template: "@SyliusOffersPlugin/admin/offer/update.html.twig"
            redirect: sylius_admin_offer_index

sylius_admin_offer_delete:
    path: /offers/{id}
    methods: [DELETE]
    defaults:
        _controller: SyliusOffersPlugin\Controller\Admin\OfferController::deleteAction
        _sylius:
            redirect: sylius_admin_offer_index

sylius_admin_offer_stats:
    path: /offers/stats
    methods: [GET]
    defaults:
        _controller: SyliusOffersPlugin\Controller\Admin\OfferController::statsAction