sylius_twig_hooks:
    hooks:
        sylius_shop.homepage.index:
            offer_banners:
                template: "@SyliusOffersPlugin/shop/components/offer_banners.html.twig"
                priority: 20
            offers:
                template: "@SyliusOffersPlugin/shop/components/offers_section.html.twig"
                priority: 15
        sylius_shop.base.offcanvas.cart.body.items:
            offers_sidebar:
                template: "@SyliusOffersPlugin/shop/components/offers_sidebar.html.twig"
                priority: 5

sylius_resource:
    resources:
        sylius_offers.offer:
            classes:
                model: SyliusOffersPlugin\Entity\Offer
                form: SyliusOffersPlugin\Form\Type\OfferType
                repository: SyliusOffersPlugin\Repository\OfferRepository

sylius_grid:
    grids:
        sylius_offers_offer:
            driver:
                name: doctrine/orm
                options:
                    class: SyliusOffersPlugin\Entity\Offer
            sorting:
                position: asc
            fields:
                image:
                    type: image
                    label: sylius.ui.image
                    path: imagePath
                title:
                    type: string
                    label: sylius.ui.title
                type:
                    type: string
                    label: sylius_offers.ui.offer_type
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete