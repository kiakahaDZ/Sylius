# src/Resources/config/services.yaml
parameters:
    sylius_best_seller.cache_ttl: 3600

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    SyliusBestSellerPlugin\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Entity,Migrations,Tests,Kernel.php,Repository,Form}'


    SyliusBestSellerPlugin\Repository\BestSellerRepository:
        alias: sylius_best_seller.repository.cache

    SyliusBestSellerPlugin\Service\BestSellerCalculator:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@SyliusBestSellerPlugin\Repository\BestSellerRepository'

    SyliusBestSellerPlugin\Service\BestSellerCacheManager:
        arguments:
            - '@cache.app'
            - '@SyliusBestSellerPlugin\Service\BestSellerProvider'
            - '@doctrine.orm.entity_manager'
            - '%sylius_best_seller.cache_ttl%'

    SyliusBestSellerPlugin\Twig\BestSellerExtension:
        tags: ['twig.extension']

    SyliusBestSellerPlugin\EventListener\OrderCompleteListener:
        tags:
            - { name: kernel.event_subscriber }

    SyliusBestSellerPlugin\Command\RecalculateBestSellersCommand:
        tags: ['console.command']

    SyliusBestSellerPlugin\Controller\Api\BestSellerController:
        public: true

    SyliusBestSellerPlugin\Controller\Admin\BestSellerConfigController:
        public: true