services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Sylius\Bundle\CoreBundle\OrderPay\Provider\UrlProviderInterface:
        alias: sylius_shop.provider.order_pay.after_pay_url

    SyliusChargilyPlugin\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Resources,Command}'

    SyliusChargilyPlugin\Controller\ChargilyWebhookAction:
        public: true
        tags: ['controller.service_arguments']

    sylius_chargily.command_provider:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator { tag: 'sylius_chargily.command_provider.action', index_by: 'action' }
        tags:
            - { name: 'sylius.payment_request.command_provider', gateway_factory: 'chargily_pay' }

    SyliusChargilyPlugin\CommandHandler\CaptureChargilyPaymentRequestHandler:
        tags:
            - { name: 'messenger.message_handler', bus: 'sylius.payment_request.command_bus', handles: 'SyliusChargilyPlugin\Command\CaptureChargilyPaymentRequest' }

    SyliusChargilyPlugin\CommandHandler\StatusChargilyPaymentRequestHandler:
        tags:
            - { name: 'messenger.message_handler', bus: 'sylius.payment_request.command_bus', handles: 'SyliusChargilyPlugin\Command\StatusChargilyPaymentRequest' }

    SyliusChargilyPlugin\CommandHandler\NotifyChargilyPaymentRequestHandler:
        tags:
            - { name: 'messenger.message_handler', bus: 'sylius.payment_request.command_bus', handles: 'SyliusChargilyPlugin\Command\NotifyChargilyPaymentRequest' }

    sylius_chargily.command_provider.capture:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\PaymentRequestCommandProviderInterface
        factory: ['SyliusChargilyPlugin\Provider\ChargilyCommandProviderFactory', 'createCapture']
        tags:
            - { name: 'sylius_chargily.command_provider.action', action: 'capture' }

    sylius_chargily.command_provider.status:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\PaymentRequestCommandProviderInterface
        factory: ['SyliusChargilyPlugin\Provider\ChargilyCommandProviderFactory', 'createStatus']
        tags:
            - { name: 'sylius_chargily.command_provider.action', action: 'status' }

    sylius_chargily.command_provider.notify:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\PaymentRequestCommandProviderInterface
        factory: ['SyliusChargilyPlugin\Provider\ChargilyCommandProviderFactory', 'createNotify']
        tags:
            - { name: 'sylius_chargily.command_provider.action', action: 'notify' }

    sylius_chargily.http_response_provider:
        class: Sylius\Bundle\PaymentBundle\Provider\ActionsHttpResponseProvider
        arguments:
            - !tagged_locator { tag: 'sylius_chargily.http_response_provider.action', index_by: 'action' }
        tags:
            - { name: 'sylius.payment_request.provider.http_response', gateway_factory: 'chargily_pay' }

    SyliusChargilyPlugin\Provider\ChargilyCaptureHttpResponseProvider:
        tags:
            - { name: 'sylius_chargily.http_response_provider.action', action: 'capture' }
