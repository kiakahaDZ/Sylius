services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    SyliusYalidinePlugin\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Resources}'

    SyliusYalidinePlugin\Client\YalidineClient:
        arguments:
            $apiId: '%sylius_yalidine.api_id%'
            $apiToken: '%sylius_yalidine.api_token%'
            $baseUrl: '%sylius_yalidine.api_base_url%'

    SyliusYalidinePlugin\Client\YalidineClientInterface: '@SyliusYalidinePlugin\Client\YalidineClient'

    SyliusYalidinePlugin\Provider\YalidineParcelPayloadProvider:
        arguments:
            $defaultFromWilaya: '%sylius_yalidine.default_from_wilaya%'
            $defaultToWilaya: '%sylius_yalidine.default_to_wilaya%'

    SyliusYalidinePlugin\Controller\Shop\YalidineApiController:
        public: true
        arguments:
            $defaultFromWilaya: '%sylius_yalidine.default_from_wilaya%'
        tags:
            - { name: controller.service_arguments }

    SyliusYalidinePlugin\Resolver\YalidineShipmentResolver:
        arguments:
            $shippingMethodCodes: '%env(csv:YALIDINE_SHIPPING_METHOD_CODES)%'

    SyliusYalidinePlugin\Twig\YalidineExtension:
        arguments:
            $shippingMethodCodes: '%env(csv:YALIDINE_SHIPPING_METHOD_CODES)%'
        tags:
            - { name: twig.extension }

    SyliusYalidinePlugin\EventListener\CreateYalidineShipmentOnOrderCompleteListener:
        arguments:
            $shipmentRepository: '@sylius.repository.shipment'
            $logger: '@logger'
        tags:
            - { name: kernel.event_subscriber }

    SyliusYalidinePlugin\Controller\Admin\YalidineShipmentController:
        public: true
        arguments:
            $shipmentRepository: '@sylius.repository.shipment'
        tags:
            - { name: controller.service_arguments }

    SyliusYalidinePlugin\Webhook\YalidineWebhookAction:
        public: true
        arguments:
            $shipmentRepository: '@sylius.repository.shipment'
            $cache: '@cache.app'
            $webhookToken: '%sylius_yalidine.webhook_token%'
            $logger: '@logger'
        tags:
            - { name: controller.service_arguments }

    # ── Yalidine Shipping Calculator ──
    SyliusYalidinePlugin\Calculator\YalidineCalculator:
        arguments:
            $defaultFromWilayaId: '%sylius_yalidine.default_from_wilaya_id%'
            $logger: '@logger'
        tags:
            - name: sylius.shipping_calculator
              calculator: yalidine
              form_type: SyliusYalidinePlugin\Form\Type\YalidineCalculatorConfigurationType
              label: sylius_yalidine.calculator.label

    SyliusYalidinePlugin\Form\Type\YalidineCalculatorConfigurationType:
        tags:
            - { name: form.type }
